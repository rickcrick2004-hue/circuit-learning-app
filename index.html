<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子配置マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-gray-800 font-sans p-2 md:p-4 lg:p-6">
    
    <!-- ヘッダーとモード切替 -->
    <div class="max-w-6xl mx-auto mb-4 flex flex-col sm:flex-row justify-between items-center bg-white p-3 md:p-4 rounded-xl shadow-sm gap-3">
        <h1 class="text-xl md:text-2xl font-bold text-indigo-700 flex items-center gap-2">
            ⚛️ 電子配置マスター
        </h1>
        
        <!-- 通常 / ゲームモード切替 -->
        <div class="flex bg-gray-100 rounded-lg p-1 shadow-inner border border-gray-200">
            <button id="mode-practice" class="px-4 py-1.5 rounded-md bg-white shadow-sm text-sm font-bold text-indigo-600 transition-all">通常モード</button>
            <button id="mode-game-1m" class="px-4 py-1.5 rounded-md text-gray-500 text-sm font-bold hover:text-indigo-600 transition-all">1分</button>
            <button id="mode-game-3m" class="px-4 py-1.5 rounded-md text-gray-500 text-sm font-bold hover:text-indigo-600 transition-all">3分</button>
        </div>
    </div>

    <!-- ゲームモード時のスコア表示UI -->
    <div id="game-ui" class="hidden max-w-6xl mx-auto mb-4 flex justify-between items-center bg-indigo-50 border-2 border-indigo-200 p-3 rounded-xl shadow-sm">
        <div class="text-indigo-800 font-bold text-lg flex items-center gap-2">
            ⏳ 残り時間: <span id="time-display" class="text-2xl text-indigo-600">60</span>秒
        </div>
        <div class="text-indigo-800 font-bold text-lg flex items-center gap-2">
            🏆 スコア: <span id="score-display" class="text-2xl text-indigo-600">0</span>問
        </div>
    </div>

    <!-- メインレイアウト -->
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-4 h-[calc(100vh-140px)] md:h-[calc(100vh-120px)]">
        
        <!-- 左側：電子配置表示エリア (Canvas) -->
        <div class="flex-1 bg-white rounded-2xl shadow-md border border-gray-200 flex flex-col overflow-hidden min-h-[300px] md:min-h-0">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                <h2 class="font-bold text-gray-700">電子配置</h2>
            </div>
            <div id="canvas-container" class="flex-1 relative w-full h-full p-4 flex items-center justify-center bg-slate-50">
                <canvas id="atomCanvas"></canvas>
            </div>
        </div>

        <!-- 右側：選択肢とコントロール -->
        <div class="flex-1 md:max-w-md lg:max-w-lg flex flex-col gap-3 bg-white p-3 md:p-4 rounded-2xl shadow-md border border-gray-200 overflow-y-auto">
            
            <!-- コントロールパネル -->
            <div class="flex flex-col gap-2 bg-gray-50 p-3 rounded-xl border border-gray-200">
                
                <!-- 出題範囲切替 -->
                <div class="flex gap-1 w-full">
                    <button class="target-mode-btn flex-1 py-2 px-1 rounded-lg text-[11px] sm:text-xs font-bold bg-indigo-500 text-white shadow-sm transition-colors" data-mode="all">
                        原子とイオン
                    </button>
                    <button class="target-mode-btn flex-1 py-2 px-1 rounded-lg text-[11px] sm:text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-mode="atom">
                        原子のみ
                    </button>
                    <button class="target-mode-btn flex-1 py-2 px-1 rounded-lg text-[11px] sm:text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-mode="ion">
                        イオンのみ
                    </button>
                </div>
                
                <div class="flex items-center gap-2">
                    <!-- 表記切替 (記号/名前) -->
                    <div class="flex-1 flex items-center justify-between bg-white p-1.5 rounded-lg border border-gray-200">
                        <span class="text-xs text-gray-700 font-semibold pl-1">表記:</span>
                        <div class="flex rounded overflow-hidden">
                            <button id="display-symbol-btn" class="px-2 py-1 text-xs font-bold bg-indigo-500 text-white transition-colors">記号</button>
                            <button id="display-name-btn" class="px-2 py-1 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">名前</button>
                        </div>
                    </div>
                    
                    <!-- ヒントボタン -->
                    <button id="hint-btn" class="flex-1 py-1.5 border-2 border-indigo-200 text-indigo-600 font-bold rounded-lg hover:bg-indigo-50 transition-colors text-xs flex justify-center items-center gap-1 bg-white">
                        💡 ヒント(原子番号)
                    </button>
                </div>
            </div>

            <!-- 選択肢グリッド -->
            <div id="choices-grid" class="flex-1 overflow-y-auto w-full content-start pt-2">
                <!-- JSで動的にボタンが追加されます -->
            </div>
        </div>
    </div>

    <!-- 結果表示モーダル -->
    <div id="result-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform transition-all text-center">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-3xl font-bold mb-2"></h3>
            <p id="modal-desc" class="text-gray-600 mb-6 text-lg"></p>
            <button id="modal-next-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-indigo-700 shadow-md transition-colors text-lg">
                次の問題へ
            </button>
            <button id="modal-close-btn" class="hidden w-full bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded-xl hover:bg-gray-300 transition-colors text-lg">
                閉じる
            </button>
        </div>
    </div>

    <!-- ゲーム開始モーダル -->
    <div id="game-start-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform transition-all text-center">
            <div class="text-6xl mb-4">🚀</div>
            <h3 class="text-3xl font-bold mb-2 text-indigo-600">ゲームモード</h3>
            <p id="game-start-desc" class="text-gray-600 mb-6 text-lg"></p>
            <button id="game-start-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-indigo-700 shadow-md transition-colors text-lg">
                スタート！
            </button>
            <button id="game-cancel-btn" class="mt-3 w-full bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-xl hover:bg-gray-300 transition-colors text-base">
                キャンセル
            </button>
        </div>
    </div>

    <script>
        // --- データの定義 ---
        const atoms = [
            { id: 'H', html: 'H', name: '水素', z: 1, e: 1 },
            { id: 'He', html: 'He', name: 'ヘリウム', z: 2, e: 2 },
            { id: 'Li', html: 'Li', name: 'リチウム', z: 3, e: 3 },
            { id: 'Be', html: 'Be', name: 'ベリリウム', z: 4, e: 4 },
            { id: 'B', html: 'B', name: 'ホウ素', z: 5, e: 5 },
            { id: 'C', html: 'C', name: '炭素', z: 6, e: 6 },
            { id: 'N', html: 'N', name: '窒素', z: 7, e: 7 },
            { id: 'O', html: 'O', name: '酸素', z: 8, e: 8 },
            { id: 'F', html: 'F', name: 'フッ素', z: 9, e: 9 },
            { id: 'Ne', html: 'Ne', name: 'ネオン', z: 10, e: 10 },
            { id: 'Na', html: 'Na', name: 'ナトリウム', z: 11, e: 11 },
            { id: 'Mg', html: 'Mg', name: 'マグネシウム', z: 12, e: 12 },
            { id: 'Al', html: 'Al', name: 'アルミニウム', z: 13, e: 13 },
            { id: 'Si', html: 'Si', name: 'ケイ素', z: 14, e: 14 },
            { id: 'P', html: 'P', name: 'リン', z: 15, e: 15 },
            { id: 'S', html: 'S', name: '硫黄', z: 16, e: 16 },
            { id: 'Cl', html: 'Cl', name: '塩素', z: 17, e: 17 },
            { id: 'Ar', html: 'Ar', name: 'アルゴン', z: 18, e: 18 },
            { id: 'K', html: 'K', name: 'カリウム', z: 19, e: 19 },
            { id: 'Ca', html: 'Ca', name: 'カルシウム', z: 20, e: 20 }
        ];

        const ions = [
            { id: 'Li+', html: 'Li<sup>+</sup>', name: 'リチウムイオン', z: 3, e: 2 },
            { id: 'O2-', html: 'O<sup>2-</sup>', name: '酸化物イオン', z: 8, e: 10 },
            { id: 'F-', html: 'F<sup>-</sup>', name: 'フッ化物イオン', z: 9, e: 10 },
            { id: 'Na+', html: 'Na<sup>+</sup>', name: 'ナトリウムイオン', z: 11, e: 10 },
            { id: 'Mg2+', html: 'Mg<sup>2+</sup>', name: 'マグネシウムイオン', z: 12, e: 10 },
            { id: 'Al3+', html: 'Al<sup>3+</sup>', name: 'アルミニウムイオン', z: 13, e: 10 },
            { id: 'S2-', html: 'S<sup>2-</sup>', name: '硫化物イオン', z: 16, e: 18 },
            { id: 'Cl-', html: 'Cl<sup>-</sup>', name: '塩化物イオン', z: 17, e: 18 },
            { id: 'K+', html: 'K<sup>+</sup>', name: 'カリウムイオン', z: 19, e: 18 },
            { id: 'Ca2+', html: 'Ca<sup>2+</sup>', name: 'カルシウムイオン', z: 20, e: 18 }
        ];

        // --- 状態管理 ---
        let currentMode = 'all'; // 'all', 'atom', 'ion'
        let displayType = 'symbol'; // 'symbol' or 'name'
        let currentTarget = null;
        let previousTarget = null;
        let isHintActive = false;
        let currentChoices = [];
        
        // ゲームモード関連
        let isGameMode = false;
        let gameTimer = null;
        let gameDuration = 60;
        let timeLeft = 60;
        let currentScore = 0;
        let answeredCorrectly = new Set();

        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');
        const choicesGrid = document.getElementById('choices-grid');
        
        // UI操作系
        const modePracticeBtn = document.getElementById('mode-practice');
        const modeGame1mBtn = document.getElementById('mode-game-1m');
        const modeGame3mBtn = document.getElementById('mode-game-3m');
        const targetModeBtns = document.querySelectorAll('.target-mode-btn');
        const displaySymbolBtn = document.getElementById('display-symbol-btn');
        const displayNameBtn = document.getElementById('display-name-btn');
        const hintBtn = document.getElementById('hint-btn');
        const gameUi = document.getElementById('game-ui');
        
        // ゲーム開始モーダル系
        const gameStartOverlay = document.getElementById('game-start-overlay');
        const gameStartDesc = document.getElementById('game-start-desc');
        const gameStartBtn = document.getElementById('game-start-btn');
        const gameCancelBtn = document.getElementById('game-cancel-btn');

        // モーダル系
        const modal = document.getElementById('result-modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalNextBtn = document.getElementById('modal-next-btn');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // イベントリスナーの登録
        window.addEventListener('resize', resizeAndDraw);
        window.onload = () => {
            initGame();
            resizeAndDraw();
        };

        modePracticeBtn.addEventListener('click', () => toggleGameMode(false));
        modeGame1mBtn.addEventListener('click', () => toggleGameMode(true, 60));
        modeGame3mBtn.addEventListener('click', () => toggleGameMode(true, 180));
        
        targetModeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // UI更新
                targetModeBtns.forEach(b => {
                    b.classList.replace('bg-indigo-500', 'bg-gray-200');
                    b.classList.replace('text-white', 'text-gray-700');
                });
                const target = e.target;
                target.classList.replace('bg-gray-200', 'bg-indigo-500');
                target.classList.replace('text-gray-700', 'text-white');
                
                // モード切替
                currentMode = target.dataset.mode;
                nextQuestion();
            });
        });

        displaySymbolBtn.addEventListener('click', () => setDisplayType('symbol'));
        displayNameBtn.addEventListener('click', () => setDisplayType('name'));
        hintBtn.addEventListener('click', toggleHint);

        gameStartBtn.addEventListener('click', startGameSequence);
        gameCancelBtn.addEventListener('click', () => toggleGameMode(false));

        modalNextBtn.addEventListener('click', () => {
            hideModal();
            nextQuestion();
        });
        modalCloseBtn.addEventListener('click', hideModal);

        function initGame() {
            nextQuestion();
        }

        function getCandidates() {
            if (currentMode === 'atom') return [...atoms];
            if (currentMode === 'ion') return [...ions];
            return [...atoms, ...ions]; // 'all'
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function nextQuestion() {
            if (isGameMode) {
                // ゲーム中は未正解の選択肢から選ぶ
                const remaining = currentChoices.filter(c => !answeredCorrectly.has(c.id));
                if (remaining.length === 0) {
                    endGame(true); // 全問正解
                    return;
                }
                
                let available = remaining;
                if (available.length > 1 && previousTarget) {
                    available = available.filter(c => c.id !== previousTarget.id);
                }
                
                currentTarget = available[Math.floor(Math.random() * available.length)];
                previousTarget = currentTarget;
                
                // 選択肢の再描画は行わず、正解状態を反映させる
                updateChoicesUI();
            } else {
                // 通常モード
                const candidates = getCandidates();
                
                let available = candidates;
                if (available.length > 1 && previousTarget) {
                    available = available.filter(c => c.id !== previousTarget.id);
                }
                
                currentTarget = available[Math.floor(Math.random() * available.length)];
                previousTarget = currentTarget;
                
                currentChoices = shuffleArray(candidates);
                renderChoices(currentChoices);
            }
            resizeAndDraw();
        }

        function renderChoices(choices) {
            choicesGrid.innerHTML = '';
            
            const isAllMode = (currentMode === 'all');
            
            // iPad等でもスクロールなしで収まるようにグリッドを細かくする
            if (isAllMode) {
                choicesGrid.className = "grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-1.5 pb-4";
            } else {
                choicesGrid.className = "grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 md:gap-3 pb-4";
            }
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.id = `choice-btn-${choice.id}`;
                
                // テキストサイズの調整
                let textSizeClass = "";
                if (displayType === 'symbol') {
                    textSizeClass = isAllMode ? "text-base sm:text-lg" : "text-lg sm:text-xl";
                } else {
                    textSizeClass = isAllMode ? "text-[9px] sm:text-[10px] px-0.5 leading-tight" : "text-xs px-1 leading-tight";
                }

                btn.className = `relative bg-white border-2 border-gray-200 rounded-xl shadow-sm hover:border-indigo-400 hover:shadow-md aspect-square flex items-center justify-center font-bold text-gray-700 overflow-hidden transition-all duration-300 opacity-100 scale-100 ${textSizeClass}`;
                
                // ヒント（原子番号）を左上に配置
                const hintSpan = document.createElement('span');
                const hintSize = isAllMode ? "text-[9px]" : "text-[10px]";
                hintSpan.className = `absolute top-0.5 left-1 ${hintSize} text-indigo-400 font-semibold hint-number ${isHintActive ? '' : 'hidden'}`;
                hintSpan.textContent = choice.z;
                
                const mainText = document.createElement('span');
                mainText.className = "text-center break-words w-full";
                if (displayType === 'symbol') {
                    mainText.innerHTML = choice.html;
                } else {
                    mainText.textContent = choice.name;
                }
                
                btn.appendChild(hintSpan);
                btn.appendChild(mainText);
                
                btn.addEventListener('click', () => handleChoiceClick(choice, btn));
                choicesGrid.appendChild(btn);
            });

            updateChoicesUI();
        }

        function updateChoicesUI() {
            currentChoices.forEach(choice => {
                const btn = document.getElementById(`choice-btn-${choice.id}`);
                if (!btn) return;
                
                if (isGameMode && answeredCorrectly.has(choice.id)) {
                    btn.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
                    btn.classList.remove('opacity-100', 'scale-100');
                } else {
                    btn.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
                    btn.classList.add('opacity-100', 'scale-100');
                }
            });
        }

        function handleChoiceClick(choice, btn) {
            const isCorrect = (choice.id === currentTarget.id);

            if (isCorrect) {
                if (isGameMode) {
                    // ゲームモード時の正解演出
                    currentScore++;
                    document.getElementById('score-display').textContent = currentScore;
                    answeredCorrectly.add(choice.id);
                    
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                    showModal(true, choice, true); // 自動で閉じるモーダル
                } else {
                    showModal(true, choice);
                }
            } else {
                // 不正解時の演出
                btn.classList.add('animate-shake', 'border-red-400');
                setTimeout(() => {
                    btn.classList.remove('animate-shake', 'border-red-400');
                }, 300);
                showModal(false, choice);
            }
        }

        function showModal(isCorrect, choice, autoClose = false) {
            modal.classList.remove('hidden');
            
            if (isCorrect) {
                modalIcon.innerHTML = '🎉';
                modalTitle.textContent = '正解！';
                modalTitle.className = 'text-3xl font-bold mb-2 text-green-600';
                modalDesc.innerHTML = `素晴らしい！<br><strong>${currentTarget.html} (${currentTarget.name})</strong> です。`;
                
                if (autoClose) {
                    modalNextBtn.classList.add('hidden');
                    modalCloseBtn.classList.add('hidden');
                    setTimeout(() => {
                        hideModal();
                        nextQuestion();
                    }, 800); // ゲームモードは0.8秒で自動進行
                } else {
                    modalNextBtn.classList.remove('hidden');
                    modalCloseBtn.classList.add('hidden');
                }
            } else {
                modalIcon.innerHTML = '❌';
                modalTitle.textContent = '間違い！';
                modalTitle.className = 'text-3xl font-bold mb-2 text-red-600';
                modalDesc.innerHTML = `選んだのは <strong>${choice.html} (${choice.name})</strong> です。<br>もう一度考えてみよう！`;
                
                modalNextBtn.classList.add('hidden');
                modalCloseBtn.classList.remove('hidden');
            }
        }

        function hideModal() {
            modal.classList.add('hidden');
        }

        function toggleHint() {
            isHintActive = !isHintActive;
            const hints = document.querySelectorAll('.hint-number');
            hints.forEach(hint => {
                if (isHintActive) {
                    hint.classList.remove('hidden');
                } else {
                    hint.classList.add('hidden');
                }
            });
            hintBtn.classList.toggle('bg-indigo-50', isHintActive);
        }

        function setDisplayType(type) {
            displayType = type;
            if (type === 'symbol') {
                displaySymbolBtn.classList.replace('text-gray-600', 'text-white');
                displaySymbolBtn.classList.replace('bg-gray-100', 'bg-indigo-500');
                displayNameBtn.classList.replace('text-white', 'text-gray-600');
                displayNameBtn.classList.replace('bg-indigo-500', 'bg-gray-100');
            } else {
                displayNameBtn.classList.replace('text-gray-600', 'text-white');
                displayNameBtn.classList.replace('bg-gray-100', 'bg-indigo-500');
                displaySymbolBtn.classList.replace('text-white', 'text-gray-600');
                displaySymbolBtn.classList.replace('bg-indigo-500', 'bg-gray-100');
            }
            if (currentChoices.length > 0) renderChoices(currentChoices);
        }

        function toggleGameMode(startPlay, duration = 60) {
            isGameMode = startPlay;
            gameDuration = duration;
            
            [modePracticeBtn, modeGame1mBtn, modeGame3mBtn].forEach(btn => {
                btn.classList.replace('bg-white', 'bg-transparent');
                btn.classList.replace('text-indigo-600', 'text-gray-500');
                btn.classList.remove('shadow-sm');
            });
            
            if (isGameMode) {
                const activeBtn = duration === 60 ? modeGame1mBtn : modeGame3mBtn;
                activeBtn.classList.replace('bg-transparent', 'bg-white');
                activeBtn.classList.replace('text-gray-500', 'text-indigo-600');
                activeBtn.classList.add('shadow-sm');
                
                gameUi.classList.remove('hidden');
                gameUi.classList.add('flex');
                
                // ゲーム中は出題範囲切替を無効化
                targetModeBtns.forEach(btn => btn.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none'));
                
                // スタート画面を表示
                stopGameTimer(); 
                currentTarget = null; // Canvasをクリアするため
                resizeAndDraw(); 
                choicesGrid.innerHTML = ''; // 選択肢をクリア
                
                gameStartDesc.textContent = `${duration / 60}分間で何問正解できるか挑戦！`;
                gameStartOverlay.classList.remove('hidden');
                
                // UIリセット
                document.getElementById('score-display').textContent = '0';
                document.getElementById('time-display').textContent = duration;

            } else {
                modePracticeBtn.classList.replace('bg-transparent', 'bg-white');
                modePracticeBtn.classList.replace('text-gray-500', 'text-indigo-600');
                modePracticeBtn.classList.add('shadow-sm');
                
                gameUi.classList.add('hidden');
                gameUi.classList.remove('flex');
                
                gameStartOverlay.classList.add('hidden');
                
                targetModeBtns.forEach(btn => btn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none'));
                
                stopGameTimer();
                answeredCorrectly.clear();
                nextQuestion(); // リセット
            }
        }

        function startGameSequence() {
            gameStartOverlay.classList.add('hidden');
            startGameTimer();
        }

        function startGameTimer() {
            clearInterval(gameTimer);
            currentScore = 0;
            timeLeft = gameDuration;
            answeredCorrectly.clear();
            
            document.getElementById('score-display').textContent = currentScore;
            document.getElementById('time-display').textContent = timeLeft;
            
            // 選択肢の固定
            currentChoices = shuffleArray(getCandidates());
            renderChoices(currentChoices);

            nextQuestion(); // 最初の問題
            
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function stopGameTimer() {
            clearInterval(gameTimer);
        }

        function endGame(isAllClear = false) {
            stopGameTimer();
            modalIcon.innerHTML = isAllClear ? '🏆' : '🏁';
            modalTitle.textContent = isAllClear ? 'パーフェクト！' : 'タイムアップ！';
            modalTitle.className = 'text-3xl font-bold mb-2 text-indigo-600';
            
            if (isAllClear) {
                const timeTaken = gameDuration - timeLeft;
                modalDesc.innerHTML = `素晴らしい！<br><strong>${timeTaken}秒</strong> で全 ${currentScore} 問正解しました！`;
            } else {
                modalDesc.innerHTML = `${gameDuration / 60}分間で <strong>${currentScore} 問</strong> 正解しました！`;
            }
            
            modalNextBtn.classList.add('hidden');
            modalCloseBtn.classList.remove('hidden');
            modalCloseBtn.textContent = '通常モードに戻る';
            
            // 閉じるボタンのイベントを一時的に変更
            const oldClose = modalCloseBtn.onclick;
            modalCloseBtn.onclick = () => {
                hideModal();
                toggleGameMode(false); // 通常モードへ戻す
                modalCloseBtn.onclick = oldClose; // イベント復元
                modalCloseBtn.textContent = '閉じる';
            };
            
            modal.classList.remove('hidden');
        }

        function resizeAndDraw() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawElectronConfig();
        }

        function drawElectronConfig() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!currentTarget) return;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // レスポンシブにサイズを決定
            const minDim = Math.min(canvas.width, canvas.height);
            const nucleusRadius = minDim * 0.08;
            const maxShellRadius = minDim * 0.45;
            const shellSpacing = (maxShellRadius - nucleusRadius) / 4;
            
            const z = currentTarget.z; // 陽子数
            const e = currentTarget.e; // 電子数

            // 1. 原子核の描画
            ctx.beginPath();
            ctx.arc(centerX, centerY, nucleusRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#fee2e2'; // Tailwind red-100
            ctx.fill();
            ctx.strokeStyle = '#ef4444'; // Tailwind red-500
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#b91c1c'; // Tailwind red-700
            ctx.font = `bold ${nucleusRadius * 0.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${z}+`, centerX, centerY);

            // 2. 電子殻への電子割り当て (K, L, M, N)
            let remainingE = e;
            const shells = [0, 0, 0, 0];
            
            shells[0] = Math.min(remainingE, 2); remainingE -= shells[0]; // K殻(max2)
            shells[1] = Math.min(remainingE, 8); remainingE -= shells[1]; // L殻(max8)
            shells[2] = Math.min(remainingE, 8); remainingE -= shells[2]; // M殻(原子番号20までは8)
            shells[3] = Math.min(remainingE, 18); remainingE -= shells[3]; // N殻
            
            // 3. 配置ルールの角度マッピング (0度が右)
            const angleRight = 0;
            const angleLeft = Math.PI;
            const angleTop = -Math.PI / 2;
            const angleBottom = Math.PI / 2;
            
            // K, N殻: 右, 左
            const twoConfig = [angleRight, angleLeft];
            
            // L, M殻: 右, 左, 上, 下, 左上, 左下, 右下, 右上
            // ※見栄えのため斜めは45度(PI/4)単位
            const eightConfig = [
                angleRight, angleLeft, angleTop, angleBottom,
                -Math.PI * 0.75, // 左上
                Math.PI * 0.75,  // 左下
                Math.PI * 0.25,  // 右下
                -Math.PI * 0.25  // 右上
            ];

            const configs = [twoConfig, eightConfig, eightConfig, twoConfig];
            
            // 4. 殻と電子の描画
            for (let i = 0; i < 4; i++) {
                if (shells[i] > 0 || i === 0) { // K殻は電子0でも描く(水素イオン等用)
                    const radius = nucleusRadius + shellSpacing * (i + 1);
                    
                    // 殻の円を描画
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#cbd5e1'; // Tailwind slate-300
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 電子の描画
                    const electronRadius = Math.max(minDim * 0.015, 4);
                    for (let j = 0; j < shells[i]; j++) {
                        const angle = configs[i][j];
                        const ex = centerX + radius * Math.cos(angle);
                        const ey = centerY + radius * Math.sin(angle);
                        
                        ctx.beginPath();
                        ctx.arc(ex, ey, electronRadius, 0, Math.PI * 2);
                        ctx.fillStyle = '#1e293b'; // Tailwind slate-800
                        ctx.fill();
                    }
                }
            }
        }
    </script>
